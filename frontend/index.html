<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GuiGazer — AI GUI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ───── Sidebar ───── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">

      <!-- Logo -->
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="url(#logo-grad)" />
            <path d="M8 11a6 6 0 0 1 12 0c0 3-3 5-6 7-3-2-6-4-6-7Z" fill="#fff" fill-opacity=".9"/>
            <circle cx="11" cy="10.5" r="1.2" fill="#8b5cf6"/>
            <circle cx="17" cy="10.5" r="1.2" fill="#8b5cf6"/>
            <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs>
          </svg>
        </div>
        <div>
          <h1 class="logo-title">GuiGazer</h1>
          <p class="logo-sub">AI GUI Agent</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="control-group">
        <label class="label" for="task-input">Task Prompt</label>
        <textarea id="task-input" class="input textarea" rows="4" placeholder="e.g. Go to google.com and search for 'AI agents'"></textarea>
      </div>

      <div class="control-group">
        <label class="label" for="url-input">Target URL</label>
        <input id="url-input" class="input" type="url" placeholder="https://example.com" />
      </div>

      <button id="start-btn" class="btn btn-primary">
        <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M6.3 2.8A1.5 1.5 0 0 0 4 4.1v11.8a1.5 1.5 0 0 0 2.3 1.3l9-5.9a1.5 1.5 0 0 0 0-2.6l-9-5.9Z"/></svg>
        Start Task
      </button>

      <button id="audit-btn" class="btn btn-secondary">
        <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.403 12.652a3 3 0 0 0 0-5.304l-.4-.228a3.07 3.07 0 0 1-1.134-1.134l-.228-.4a3 3 0 0 0-5.304 0l-.228.4a3.07 3.07 0 0 1-1.134 1.134l-.4.228a3 3 0 0 0 0 5.304l.4.228a3.07 3.07 0 0 1 1.134 1.134l.228.4a3 3 0 0 0 5.304 0l.228-.4a3.07 3.07 0 0 1 1.134-1.134l.4-.228ZM10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" clip-rule="evenodd"/></svg>
        Run Audit
      </button>

      <!-- Status indicator -->
      <div class="status-wrap" id="status-wrap">
        <span class="status-dot idle" id="status-dot"></span>
        <span class="status-text" id="status-text">Idle</span>
      </div>

      <!-- Footer -->
      <div class="sidebar-footer">
        <p>GuiGazer v1.0</p>
        <p>WCAG 2.1 Accessibility</p>
      </div>
    </div>
  </aside>

  <!-- ───── Main content ───── -->
  <main class="main">

    <!-- Screenshot viewer -->
    <section class="card viewer-card" id="viewer-card">
      <div class="card-header">
        <h2 class="card-title">
          <svg class="section-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M1 5.25A2.25 2.25 0 0 1 3.25 3h13.5A2.25 2.25 0 0 1 19 5.25v9.5A2.25 2.25 0 0 1 16.75 17H3.25A2.25 2.25 0 0 1 1 14.75v-9.5Zm1.5 0a.75.75 0 0 1 .75-.75h13.5a.75.75 0 0 1 .75.75v9.5a.75.75 0 0 1-.75.75H3.25a.75.75 0 0 1-.75-.75v-9.5Z"/></svg>
          Live Screenshot
        </h2>
        <span class="step-counter" id="step-counter">Step 0</span>
      </div>
      <div class="viewer" id="screenshot-viewer">
        <div class="placeholder" id="viewer-placeholder">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <rect x="8" y="12" width="48" height="36" rx="4" stroke="currentColor" stroke-width="2" fill="none" opacity=".25"/>
            <circle cx="24" cy="28" r="5" stroke="currentColor" stroke-width="2" fill="none" opacity=".25"/>
            <path d="M12 42l12-10 8 6 10-12 10 14" stroke="currentColor" stroke-width="2" fill="none" opacity=".25" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p>No screenshot yet</p>
          <p class="placeholder-hint">Start a task to see live annotated screenshots here</p>
        </div>
        <img id="screenshot-img" class="screenshot-img hidden" alt="Annotated screenshot" />
      </div>
    </section>

    <!-- Action log -->
    <section class="card log-card" id="log-card">
      <div class="card-header">
        <h2 class="card-title">
          <svg class="section-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2 4.75A.75.75 0 0 1 2.75 4h14.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 4.75ZM2 10a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 10Zm0 5.25a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1-.75-.75Z" clip-rule="evenodd"/></svg>
          Action Log
        </h2>
        <button class="clear-btn" id="clear-log" title="Clear log">
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 0 0 6 3.75v.443a41 41 0 0 0-1.783.18A.75.75 0 0 0 4.4 5.86l.3 9.066A2.75 2.75 0 0 0 7.446 17.5h5.108a2.75 2.75 0 0 0 2.746-2.574l.3-9.066a.75.75 0 0 0 .183-1.487A41 41 0 0 0 14 4.193V3.75A2.75 2.75 0 0 0 11.25 1h-2.5ZM10 4c-1.257 0-2.5.05-3.728.148l-.002.002.3 9.066c.053 1.59 1.37 2.784 2.876 2.784h1.108c1.507 0 2.823-1.194 2.876-2.784l.3-9.066A38 38 0 0 0 10 4Zm-1.25-1.5a1.25 1.25 0 0 0-1.25 1.25v.2A40 40 0 0 1 10 3.75c.844 0 1.68.032 2.5.095V3.75a1.25 1.25 0 0 0-1.25-1.25h-2.5Z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <div class="action-log" id="action-log">
        <div class="log-empty" id="log-empty">
          <p>Actions will appear here as the agent runs…</p>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
